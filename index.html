<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inled F-Droid · Repositorio Pulsar OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center px-4 py-8 text-slate-800 selection:bg-sky-500 selection:text-white">

  <!-- Top Inled Brand Logo -->
  <div class="w-full max-w-md flex flex-col items-center pt-4 pb-6">
    <div class="flex items-center tracking-tight font-extrabold text-3xl select-none" style="color: #2bb3ff;">
      <span class="relative inline-block">
        <span class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#ef4444] rounded-sm"></span>
        I
      </span>NLED
    </div>
  </div>

  <!-- Main Clean Card -->
  <main class="w-full max-w-md bg-white border border-slate-200/90 rounded-2xl p-7 md:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
    
    <div class="text-center mb-6">
      <h1 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">Repositorio F-Droid</h1>
      <p class="text-xs md:text-sm text-slate-500 mt-1">Aplicaciones oficiales de Pulsar OS para tu smartphone.</p>
    </div>

    <!-- Repository URL input -->
    <div class="mb-5">
      <label for="repoInput" class="block text-[11px] font-bold text-slate-500 tracking-wider uppercase mb-1.5">
        URL DEL REPOSITORIO
      </label>
      <div class="flex items-center justify-between border border-slate-300 rounded-xl px-3.5 py-2.5 bg-white shadow-sm focus-within:border-slate-800 transition">
        <input 
          type="text" 
          id="repoInput" 
          readonly 
          value="https://fdroid.inled.es/repo" 
          class="w-full text-xs font-mono text-slate-800 bg-transparent outline-none select-all"
        >
        <button 
          id="btnCopy" 
          onclick="copyRepoUrl()" 
          class="ml-2 text-xs font-semibold text-slate-700 hover:text-slate-900 px-2.5 py-1 rounded-md bg-slate-100 hover:bg-slate-200 border border-slate-200 transition shrink-0"
        >
          Copiar
        </button>
      </div>
    </div>

    <!-- QR Code Container -->
    <div class="flex flex-col items-center justify-center p-4 border border-slate-200 rounded-xl bg-slate-50/60 mb-5">
      <div class="bg-white p-2 rounded-lg border border-slate-200/80 shadow-sm">
        <img 
          id="qrCodeImg" 
          src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://fdroid.inled.es/repo" 
          alt="QR Code Repositorio F-Droid" 
          class="w-36 h-36 rounded"
        >
      </div>
      <span class="text-[11px] text-slate-500 mt-2.5 font-medium">Escanea con F-Droid, Droid-ify o Neo Store</span>
    </div>

    <!-- Actions -->
    <div class="space-y-2.5">
      <!-- Primary Dark Inled Button -->
      <a 
        id="btnFdroid" 
        href="fdroidrepos://fdroid.inled.es/repo" 
        class="w-full bg-[#0f172a] hover:bg-[#1e293b] text-white font-medium text-sm py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm transition"
      >
        <span>Añadir a F-Droid</span>
        <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </a>

      <!-- Secondary Direct APK Download -->
      <a 
        href="https://github.com/Inled-Pulsar-OS/sayri-android/releases/latest" 
        target="_blank" 
        class="w-full bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs py-2.5 px-4 rounded-xl border border-slate-300 flex items-center justify-center gap-1.5 transition"
      >
        <svg class="w-4 h-4 text-slate-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>Descargar Sayri Mobile APK</span>
      </a>
    </div>

    <!-- Included App Item -->
    <div class="mt-6 pt-5 border-t border-slate-100 flex items-center gap-3">
      <img src="icon.png" alt="Sayri" class="w-10 h-10 rounded-xl border border-slate-200 shadow-sm shrink-0">
      <div class="text-left flex-1 min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="font-bold text-xs text-slate-900 truncate">Sayri Mobile</span>
          <span class="text-[10px] font-mono text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">v0.1.1</span>
        </div>
        <p class="text-[11px] text-slate-500 truncate">Copiloto IA integrado en Android y Pulsar OS</p>
      </div>
    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="w-full max-w-md text-center py-6">
    <p class="text-xs text-slate-400 font-medium">
      Licenciado bajo MIT-INLED
    </p>
  </footer>

  <script>
    const repoUrl = "https://fdroid.inled.es/repo";

    function copyRepoUrl() {
      navigator.clipboard.writeText(repoUrl).then(() => {
        const btn = document.getElementById("btnCopy");
        btn.innerText = "¡Copiado!";
        btn.classList.add("text-emerald-700", "bg-emerald-50", "border-emerald-200");
        setTimeout(() => {
          btn.innerText = "Copiar";
          btn.classList.remove("text-emerald-700", "bg-emerald-50", "border-emerald-200");
        }, 2000);
      });
    }
  </script>
</body>
</html>
