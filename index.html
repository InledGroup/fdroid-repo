<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inled F-Droid Repository</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center px-4 py-10 text-slate-800 selection:bg-sky-500 selection:text-white">

  <!-- Top Brand Logo -->
  <header class="w-full max-w-md flex flex-col items-center pt-2 pb-6">
    <img 
      src="inled_logo.png" 
      alt="Inled" 
      class="h-12 w-auto object-contain select-none"
    >
  </header>

  <!-- Main Clean Card -->
  <main class="w-full max-w-md bg-white border border-slate-200/90 rounded-2xl p-7 md:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
    
    <div class="text-center mb-6">
      <h1 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">F-Droid Repository</h1>
      <p class="text-xs md:text-sm text-slate-500 mt-1">Official Android application repository by InledGroup.</p>
    </div>

    <!-- Repository URL input -->
    <div class="mb-5">
      <label for="repoInput" class="block text-[11px] font-bold text-slate-500 tracking-wider uppercase mb-1.5">
        REPOSITORY URL
      </label>
      <div class="flex items-center justify-between border border-slate-300 rounded-xl px-3.5 py-2.5 bg-white shadow-sm focus-within:border-slate-800 transition">
        <input 
          type="text" 
          id="repoInput" 
          readonly 
          value="https://fdroid.inled.es/repo" 
          class="w-full text-xs font-mono text-slate-800 bg-transparent outline-none select-all"
        >
        <button 
          id="btnCopy" 
          onclick="copyRepoUrl()" 
          class="ml-2 text-xs font-semibold text-slate-700 hover:text-slate-900 px-2.5 py-1 rounded-md bg-slate-100 hover:bg-slate-200 border border-slate-200 transition shrink-0"
        >
          Copy
        </button>
      </div>
    </div>

    <!-- QR Code Container -->
    <div class="flex flex-col items-center justify-center p-4 border border-slate-200 rounded-xl bg-slate-50/60 mb-5">
      <div class="bg-white p-2 rounded-lg border border-slate-200/80 shadow-sm">
        <img 
          id="qrCodeImg" 
          src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://fdroid.inled.es/repo?fingerprint=C34A06082E0939F458B8960BF4982FA72AF1DFF636EAD79EABC5624F8D69F7EA" 
          alt="QR Code" 
          class="w-36 h-36 rounded"
        >
      </div>
      <span class="text-[11px] text-slate-500 mt-2.5 font-medium">Scan with F-Droid, Droid-ify, or Neo Store</span>
    </div>

    <!-- Primary Action Button -->
    <div class="space-y-2.5">
      <a 
        id="btnFdroid" 
        href="fdroidrepos://fdroid.inled.es/repo?fingerprint=C34A06082E0939F458B8960BF4982FA72AF1DFF636EAD79EABC5624F8D69F7EA" 
        class="w-full bg-[#0f172a] hover:bg-[#1e293b] text-white font-medium text-sm py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm transition"
      >
        <span>Add to F-Droid</span>
        <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>

    <!-- Fingerprint / Details -->
    <div class="mt-6 pt-5 border-t border-slate-100 text-left">
      <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Fingerprint (SHA-256)</span>
      <p class="text-[10px] font-mono text-slate-600 break-all select-all bg-slate-50 p-2 rounded-lg border border-slate-200">
        C34A06082E0939F458B8960BF4982FA72AF1DFF636EAD79EABC5624F8D69F7EA
      </p>
    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="w-full max-w-md text-center py-6">
    <p class="text-xs text-slate-400 font-medium">
      Licensed under MIT-INLED
    </p>
  </footer>

  <script>
    const fullRepoUrl = "https://fdroid.inled.es/repo?fingerprint=C34A06082E0939F458B8960BF4982FA72AF1DFF636EAD79EABC5624F8D69F7EA";

    function copyRepoUrl() {
      navigator.clipboard.writeText(fullRepoUrl).then(() => {
        const btn = document.getElementById("btnCopy");
        btn.innerText = "Copied!";
        btn.classList.add("text-emerald-700", "bg-emerald-50", "border-emerald-200");
        setTimeout(() => {
          btn.innerText = "Copy";
          btn.classList.remove("text-emerald-700", "bg-emerald-50", "border-emerald-200");
        }, 2000);
      });
    }
  </script>
</body>
</html>
