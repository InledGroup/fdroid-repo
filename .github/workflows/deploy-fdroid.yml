name: Build F-Droid Repo and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "fdroid-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & F-Droid Server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner zipalign fdroidserver || pip install fdroidserver

      - name: Fetch Latest Sayri Mobile APK from GitHub Releases
        run: |
          mkdir -p repo/icons
          echo "Checking latest release from Inled-Pulsar-OS/sayri-android..."
          RELEASE_JSON=$(curl -sSL "https://api.github.com/repos/Inled-Pulsar-OS/sayri-android/releases/latest")
          APK_URL=$(echo "$RELEASE_JSON" | grep -o 'https://[^"]*sayri-mobile-release\.apk' | head -n 1)
          
          if [ -z "$APK_URL" ]; then
            APK_URL=$(echo "$RELEASE_JSON" | grep -o 'https://[^"]*\.apk' | head -n 1)
          fi

          if [ -n "$APK_URL" ]; then
            echo "Downloading latest online APK: $APK_URL"
            curl -sSL -o "repo/sayri-mobile-release.apk" "$APK_URL"
          fi

      - name: Build F-Droid Repository Index
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          fdroid update || fdroid update --create-metadata

          python3 - << 'EOF'
          import json, os, shutil, zipfile

          # 1. Ensure hash-named icons exist for V2
          if os.path.exists("repo/index-v2.json"):
              with open("repo/index-v2.json", "r") as f:
                  v2 = json.load(f)
              for pkg, data in v2.get("packages", {}).items():
                  icon_info = data.get("metadata", {}).get("icon", {}).get("en-US", {})
                  icon_name = icon_info.get("name")
                  if icon_name:
                      target_path = os.path.join("repo", icon_name.lstrip("/"))
                      if not os.path.exists(target_path):
                          src_path = os.path.join(os.path.dirname(target_path), "icon.png")
                          if os.path.exists(src_path):
                              shutil.copyfile(src_path, target_path)
                              print(f"Restored V2 icon: {target_path}")

          # 2. Ensure V1 icons are set in index-v1.json and index-v1.jar
          if os.path.exists("repo/index-v1.json"):
              with open("repo/index-v1.json", "r") as f:
                  v1 = json.load(f)
              modified = False
              for app in v1.get("apps", []):
                  pkg = app.get("packageName")
                  if not app.get("icon"):
                      icon_file = f"{pkg}.png"
                      target_icon = os.path.join("repo/icons", icon_file)
                      src_meta = f"metadata/{pkg}/en-US/images/icon.png"
                      if not os.path.exists(target_icon) and os.path.exists(src_meta):
                          os.makedirs("repo/icons", exist_ok=True)
                          shutil.copyfile(src_meta, target_icon)
                      if os.path.exists(target_icon):
                          app["icon"] = icon_file
                          modified = True
                          print(f"Set V1 icon for {pkg}: {icon_file}")
              if modified:
                  with open("repo/index-v1.json", "w") as f:
                      json.dump(v1, f, indent=2)
                  if os.path.exists("repo/index-v1.jar"):
                      with zipfile.ZipFile("repo/index-v1.jar", "w") as z:
                          z.write("repo/index-v1.json", "index-v1.json")
          EOF

          jarsigner -keystore keystore.p12 -storepass inledfdroid -digestalg SHA-256 -sigalg SHA256withRSA repo/index-v1.jar inled || true
          jarsigner -keystore keystore.p12 -storepass inledfdroid -digestalg SHA-256 -sigalg SHA256withRSA repo/index.jar inled || true
          jarsigner -keystore keystore.p12 -storepass inledfdroid -digestalg SHA-256 -sigalg SHA256withRSA repo/entry.jar inled || true

      - name: Prepare Website and Repository Artifacts
        run: |
          mkdir -p dist
          cp index.html dist/
          cp icon.png dist/ 2>/dev/null || true
          cp inled_logo.png dist/ 2>/dev/null || true
          cp -r repo dist/

      - name: Commit Updated Index to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git commit -m "chore(fdroid): update repository metadata and signed index [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push to main failed or up to date"

      - name: Deploy to Cloudflare Pages (via Wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Deploying to Cloudflare Pages..."
            npx wrangler pages deploy dist --project-name=inled-fdroid
          else
            echo "Cloudflare credentials not set, skipping Cloudflare Pages deploy."
          fi

      - name: Deploy to GitHub Pages (Mirror)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
