name: Build F-Droid Repo and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "fdroid-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & F-Droid Server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner zipalign
          pip install --upgrade pip fdroidserver requests

      - name: Fetch Latest Sayri Mobile APK from GitHub Releases
        run: |
          mkdir -p repo/icons
          echo "Fetching latest release from Inled-Pulsar-OS/sayri-android..."
          RELEASE_JSON=$(curl -sSL "https://api.github.com/repos/Inled-Pulsar-OS/sayri-android/releases/latest")
          APK_URL=$(echo "$RELEASE_JSON" | grep -o 'https://[^"]*sayri-mobile-release\.apk' | head -n 1)
          
          if [ -z "$APK_URL" ]; then
            APK_URL=$(echo "$RELEASE_JSON" | grep -o 'https://[^"]*\.apk' | head -n 1)
          fi

          if [ -n "$APK_URL" ]; then
            echo "Downloading $APK_URL into repo/..."
            curl -sSL -o "repo/sayri-mobile-release.apk" "$APK_URL"
          else
            echo "No online release found yet, checking local repo/..."
          fi

      - name: Generate or Restore Repository Keystore
        run: |
          if [ ! -f "keystore.p12" ]; then
            echo "Generating self-signed repository keystore..."
            keytool -genkeypair -keystore keystore.p12 -storepass inledfdroid -alias inled \
              -keypass inledfdroid -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Inled Pulsar OS F-Droid, OU=InledGroup, O=Inled, C=ES" \
              -deststoretype PKCS12
          fi

      - name: Build F-Droid Repository Index
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          fdroid update -c --nosign || fdroid update -c

      - name: Prepare Website and Repository Artifacts
        run: |
          mkdir -p dist
          cp index.html dist/
          cp icon.png dist/ 2>/dev/null || true
          cp -r repo dist/

      - name: Deploy to Cloudflare Pages
        id: cf_pages
        continue-on-error: true
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'inled-fdroid'
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages (Fallback & Mirror)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
